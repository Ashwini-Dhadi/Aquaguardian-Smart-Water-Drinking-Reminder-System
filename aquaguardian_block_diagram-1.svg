<svg viewBox="0 0 700 580" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="580" fill="#ffffff"/>

  <!-- KEYPAD -->
  <rect x="35" y="35" width="150" height="60" fill="#cfe8fb" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a38">KEYPAD</text>

  <!-- SWITCH (config) -->
  <rect x="35" y="160" width="150" height="60" fill="#d4f5d4" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="197" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b3a1b">SWITCH</text>

  <!-- SWITCH (was DRINK BUTTON) -->
  <rect x="35" y="330" width="150" height="65" fill="#fde3c8" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b3d0f">SWITCH</text>

  <!-- Main controller box -->
  <rect x="325" y="20" width="150" height="470" fill="#e8ecf7" stroke="#2c3e50" stroke-width="2.5"/>
  <text x="400" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a45">LPC2148</text>

  <!-- RTC box -->
  <rect x="360" y="30" width="80" height="45" fill="#fdf3c7" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c4b00">RTC</text>

  <!-- EINT box for SWITCH (config) - placed inside the LPC2148 boundary -->
  <rect x="330" y="160" width="35" height="60" fill="#e6e6e6" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="347" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">E</text>
  <text x="347" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">I</text>
  <text x="347" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">N</text>
  <text x="347" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">T</text>

  <!-- LCD -->
  <rect x="520" y="35" width="145" height="60" fill="#d3f3ec" stroke="#2c3e50" stroke-width="2"/>
  <text x="592" y="72" text-anchor="middle" font-size="18" font-weight="bold" fill="#0a5443">LCD</text>

  <!-- GREEN LED -->
  <rect x="520" y="145" width="145" height="60" fill="#cdf0cd" stroke="#2c3e50" stroke-width="2"/>
  <text x="592" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e1b">GREEN</text>
  <text x="592" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e1b">LED</text>

  <!-- YELLOW LED -->
  <rect x="520" y="245" width="145" height="60" fill="#fdf3c2" stroke="#2c3e50" stroke-width="2"/>
  <text x="592" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5f00">YELLOW</text>
  <text x="592" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5f00">LED</text>

  <!-- BUZZER -->
  <rect x="520" y="345" width="145" height="60" fill="#f6d6ea" stroke="#2c3e50" stroke-width="2"/>
  <text x="592" y="382" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a1f57">BUZZER</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1b2a38"/>
    </marker>
  </defs>

  <line x1="185" y1="65" x2="323" y2="65" stroke="#1b2a38" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="185" y1="190" x2="325" y2="190" stroke="#1b2a38" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="185" y1="362" x2="323" y2="362" stroke="#1b2a38" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="475" y1="65" x2="518" y2="65" stroke="#1b2a38" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="475" y1="175" x2="518" y2="175" stroke="#1b2a38" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="275" x2="518" y2="275" stroke="#1b2a38" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="375" x2="518" y2="375" stroke="#1b2a38" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
