<svg width="700" height="560" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AquaGuardian block diagram</title>
<desc>Keypad, switch, and drink button feed into the LPC2148 microcontroller with an internal RTC, which drives an LCD, green LED, yellow LED, and a buzzer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="700" height="560" fill="#ffffff"/>

<!-- Left inputs -->
<rect x="60" y="60" width="150" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="135" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1B0C">Keypad</text>

<rect x="60" y="180" width="150" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="135" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1B0C">Switch</text>

<rect x="60" y="300" width="150" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="135" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1B0C">Drink</text>
<text x="135" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A1B0C">button</text>

<!-- MCU -->
<rect x="280" y="60" width="150" height="430" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="355" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2C2C2A">LPC2148</text>

<rect x="300" y="115" width="110" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="355" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#26215C">RTC</text>

<!-- Right outputs -->
<rect x="500" y="60" width="150" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="575" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#042C53">LCD</text>

<rect x="500" y="180" width="150" height="70" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="575" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#173404">Green</text>
<text x="575" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#173404">LED</text>

<rect x="500" y="300" width="150" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="575" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#412402">Yellow</text>
<text x="575" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#412402">LED</text>

<rect x="500" y="420" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="575" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#04342C">Buzzer</text>

<!-- Arrows: left inputs to MCU -->
<line x1="210" y1="95" x2="278" y2="95" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210" y1="215" x2="278" y2="215" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210" y1="335" x2="278" y2="335" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Arrows: MCU to right outputs -->
<line x1="432" y1="95" x2="498" y2="95" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="215" x2="498" y2="215" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="335" x2="498" y2="335" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="455" x2="498" y2="455" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
